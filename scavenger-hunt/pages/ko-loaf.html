<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashley-Koushik Wedding 2025 Scavenger Hunt</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <script src="../script.js" defer></script>
  </head>
  <body>
    <h1>
      Loaf Ko
    </h1>
    <h2>
      July 2025
     </h2>
    <img src="../images/cats/ko-loaf.png" class="catpic">
    <!-- Quiz Section -->
    <div id="quiz-section" class="container">
      <h3 class="quiz-question">Where was Ko found?</h3>
      <div id="quiz-feedback"></div>
      <form id="quiz-form">
        <div class="quiz-options">
          <label class="quiz-option">
            <input type="radio" name="answer" value="Behind a house in Berkeley">
            <span class="quiz-option-text">Behind a house in Berkeley</span>
          </label>
          <label class="quiz-option">
            <input type="radio" name="answer" value="Under a truck in Emeryville">
            <span class="quiz-option-text">Under a truck in Emeryville</span>
          </label>
          <label class="quiz-option">
            <input type="radio" name="answer" value="In a park in San Francisco">
            <span class="quiz-option-text">In a park in San Francisco</span>
          </label>
        </div>
        <button type="submit" class="quiz-submit-btn">Submit Answer</button>
      </form>
    </div>
    
    <!-- Success message - initially hidden -->
    <div id="success-message" class="container" style="display: none;">
      <p style="color: #FFFFFF; font-size: 1.3em; text-align: center; font-weight: bold; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);">
        🎉 You got it! Ko was discovered trying to eat birdseed, and her first "real food" was dog food. 🎉
      </p>
    </div>
    
    <!-- Return button - initially hidden -->
    <a class="return-button" href="../index.html" id="return-button" style="display: none;">Return to Progress</a>
  </body>
</html>
