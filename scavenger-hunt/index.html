<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding 2025 Scavenger Hunt</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>🔍 Scavenger Hunt 🔍</h1> 
        <h1>+</h1>
        <h1>🧩 Quiz Game 🧩</h1>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 3 cats found</div>
        
        <div class="cat-grid" id="catGrid">
            <!-- Cat items will be generated by JavaScript -->
        </div>
        
        <div class="completion-message" id="completionMessage">
            🎉 Congratulations! You've found all the cats! 🎉
        </div>
        
        <div style="text-align: center;">
            <button class="reset-button" onclick="resetProgress()">Reset Progress</button>
        </div>
    </div>

    <script>
        // Scavenger Hunt JavaScript Functions (simplified version for index page)
        // Configuration - define your cats and their corresponding pages
        const cats = [
            { name: 'Angry Vega', shortname: 'vega-angry', image: 'images/cats/vega-angry.png', page: 'vega-angry.html' },
            { name: 'Looking Back Vega', shortname: 'vega-back', image: 'images/cats/vega-back.png', page: 'vega-back.html' },
            { name: 'Passed Out Vega', shortname: 'vega-passed-out', image: 'images/cats/vega-passed-out.png', page: 'vega-passed-out.html' }
        ];

        // Function to check if a specific page has been visited
        function isPageVisited(pageName) {
          // For web domains, check cookies
          const cookieName = `visited_${pageName}=`;
          const cookies = document.cookie.split(';');
          
          for (let cookie of cookies) {
              cookie = cookie.trim();
              if (cookie.indexOf(cookieName) === 0) {
                  return cookie.substring(cookieName.length) === 'true';
              }
          }
          return false;
        }

        // Function to generate the cat grid
        function generateCatGrid() {
            const grid = document.getElementById('catGrid');
            grid.innerHTML = '';
            
            cats.forEach(cat => {
                const isVisited = isPageVisited(cat.shortname);
                
                const catItem = document.createElement('a');
                catItem.className = `cat-item ${isVisited ? 'visited' : 'unvisited'}`;
                
                catItem.innerHTML = `
                    <img src="${cat.image}" alt="${cat.name}" class="cat-image" onerror="this.style.display='none'; this.nextElementSibling.style.fontSize='4em';">
                    <div class="cat-label">${cat.name}</div>
                `;
                grid.appendChild(catItem);
            });
        }

        // Function to update progress bar and text
        function updateProgress() {
            const visitedCount = cats.filter(cat => isPageVisited(cat.shortname)).length;
            const totalCount = cats.length;
            const percentage = (visitedCount / totalCount) * 100;
            
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${visitedCount} / ${totalCount} cats found`;
            
            // Show completion message if all cats are found
            const completionMessage = document.getElementById('completionMessage');
            if (visitedCount === totalCount) {
                completionMessage.style.display = 'block';
            } else {
                completionMessage.style.display = 'none';
            }
        }

        // Function to reset all progress
        function resetProgress() {
            // For web domains, clear cookies
            cats.forEach(cat => {
                document.cookie = `visited_${cat.shortname}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/`;
            });
            console.log('All progress reset');
            // Refresh the display
            generateCatGrid();
            updateProgress();
        }

        // Initialize the page
        function initializePage() {
            generateCatGrid();
            updateProgress();
        }

        // Run when page loads
        document.addEventListener('DOMContentLoaded', initializePage);

        // Auto-refresh every 2 seconds to check for updates
        setInterval(() => {
            generateCatGrid();
            updateProgress();
        }, 2000);
    </script>
</body>
</html>
