<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clever 2025 Scavenger Hunt</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>🔍 Clever 🔍
            <br/>
            Scavenger 
            <br/>
            Hunt
        </h1>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 3 items found</div>
        
        <div class="item-grid" id="itemGrid">
            <!-- Item items will be generated by JavaScript -->
        </div>
        
        <div class="completion-message" id="completionMessage">
            🎉 Congratulations! You've found all the items! 🎉
        </div>
        
        <div style="text-align: center;">
            <button class="reset-button" onclick="resetProgress()">Reset Progress</button>
        </div>
    </div>

    <script>
        // Scavenger Hunt JavaScript Functions (simplified version for index page)
        // Configuration - define your items and their corresponding pages
        const items = [
            { name: 'BTS', shortname: 'bts', emoji: '🏫', image: 'images/items/bts.png', page: 'bts.html' },
            { name: 'Bus', shortname: 'bus', emoji: '🚌', image: 'images/items/bus.png', page: 'bus.html' },
            { name: 'Camp Clever', shortname: 'campclever', emoji: '🏕️', image: 'images/items/campclever.png', page: 'campclever.html' },
            { name: 'Camping', shortname: 'camping', emoji: '⛺', image: 'images/items/camping.png', page: 'camping.html' },
            { name: 'Chili Heads', shortname: 'chiliheads', emoji: '🌶️', image: 'images/items/chiliheads.png', page: 'chiliheads.html' },
            { name: 'Diwali', shortname: 'diwali', emoji: '🪔', image: 'images/items/diwali.png', page: 'diwali.html' },
            { name: 'Kayak', shortname: 'kayak', emoji: '🛶', image: 'images/items/kayak.png', page: 'kayak.html' },
            { name: 'Lint', shortname: 'lint', emoji: '🧹', image: 'images/items/lint.png', page: 'lint.html' },
            { name: 'Lion', shortname: 'lion', emoji: '🦁', image: 'images/items/lion.png', page: 'lion.html' },
            { name: 'Lunar New Year', shortname: 'lny', emoji: '🧧', image: 'images/items/lny.png', page: 'lny.html' },
            { name: 'Psyduck', shortname: 'psyduck', emoji: '🦆', image: 'images/items/psyduck.png', page: 'psyduck.html' },
            { name: 'Skateboard', shortname: 'skateboard', emoji: '🛹', image: 'images/items/skateboard.png', page: 'skateboard.html' },
            { name: 'Surfboard', shortname: 'surfboard', emoji: '🏄', image: 'images/items/surfboard.png', page: 'surfboard.html' },
            { name: 'Winter Rally Mascot', shortname: 'winter-rally-mascot', emoji: '🐧', image: 'images/items/winter-rally-mascot.png', page: 'winter-rally-mascot.html' },
            { name: 'Winter Rally', shortname: 'winterrally', emoji: '❄️', image: 'images/items/winterrally.png', page: 'winterrally.html' }
        ];
        // Function to check if a specific page has been visited
        function isPageVisited(pageName) {
          // For web domains, check cookies
          const cookieName = `visited_${pageName}=`;
          const cookies = document.cookie.split(';');
          
          for (let cookie of cookies) {
              cookie = cookie.trim();
              if (cookie.indexOf(cookieName) === 0) {
                  return cookie.substring(cookieName.length) === 'true';
              }
          }
          return false;
        }

        // Function to generate the item grid
        function generateItemGrid() {
            const grid = document.getElementById('itemGrid');
            grid.innerHTML = '';
            
            items.forEach(item => {
                const isVisited = isPageVisited(item.shortname);
                
                const itemItem = document.createElement('a');
                // itemItem.href = item.page;
                itemItem.className = `item-item ${isVisited ? 'visited' : 'unvisited'}`;
                
                itemItem.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="item-image" onerror="this.style.display='none'; this.nextElementSibling.style.fontSize='4em';">
                    <div class="item-label">${item.emoji}</div>
                `;
                
                grid.appendChild(itemItem);
            });
        }

        // Function to update progress bar and text
        function updateProgress() {
            const visitedCount = items.filter(item => isPageVisited(item.shortname)).length;
            const totalCount = items.length;
            const percentage = (visitedCount / totalCount) * 100;
            
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${visitedCount} / ${totalCount} items found`;
            
            // Show completion message if all items are found
            const completionMessage = document.getElementById('completionMessage');
            if (visitedCount === totalCount) {
                completionMessage.style.display = 'block';
            } else {
                completionMessage.style.display = 'none';
            }
        }

        // Function to reset all progress
        function resetProgress() {
            // For web domains, clear cookies
            items.forEach(item => {
                document.cookie = `visited_${item.shortname}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/`;
            });
            console.log('All progress reset');
            // Refresh the display
            generateItemGrid();
            updateProgress();
        }

        // Initialize the page
        function initializePage() {
            generateItemGrid();
            updateProgress();
        }

        // Run when page loads
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
